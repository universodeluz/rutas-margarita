<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rutero Margarita - Guía de Transporte Público</title>
  
  <!-- Configuración PWA -->
  <meta name="theme-color" content="#0284c7">
  <link rel="manifest" href="data:application/manifest+json,{
    'name': 'Rutero Margarita',
    'short_name': 'RuteroMGA',
    'start_url': './index.html',
    'display': 'standalone',
    'background_color': '#f8fafc',
    'theme_color': '#0284c7',
    'icons': [{
      'src': 'https://img.icons8.com/color/192/000000/bus.png',
      'sizes': '192x192',
      'type': 'image/png'
    }]
  }">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --secondary: #0d9488;
      --accent: #f59e0b;
      --bg-light: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--bg-light);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #0284c7, #0f766e);
      color: white;
      padding: 1.5rem 1rem;
      text-align: center;
      box-shadow: var(--shadow);
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    header p {
      font-size: 0.95rem;
      opacity: 0.9;
      margin-top: 5px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      width: 100%;
      flex: 1;
    }

    /* Tarjeta de Tasa y Conversor */
    .fare-converter-bar {
      background: #e0f2fe;
      border: 1px solid #bae6fd;
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .fare-converter-bar div {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--primary-dark);
      font-weight: 500;
    }

    .fare-converter-bar input {
      padding: 6px 10px;
      border: 1px solid var(--primary);
      border-radius: 6px;
      width: 100px;
      outline: none;
      background: white;
    }

    .filter-section {
      background: var(--card-bg);
      padding: 1.2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
    }

    @media (max-width: 768px) {
      .filter-section {
        grid-template-columns: 1fr;
      }
      .fare-converter-bar {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    .search-box {
      position: relative;
    }

    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-box input {
      width: 100%;
      padding: 12px 12px 12px 42px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    select {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      background: white;
      cursor: pointer;
    }

    .app-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 900px) {
      .app-content {
        grid-template-columns: 1fr;
      }
    }

    #map-container {
      position: sticky;
      top: 1.5rem;
      height: 520px;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .routes-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .route-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.2rem;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transition: transform 0.2s, border-color 0.2s;
      cursor: pointer;
    }

    .route-card:hover, .route-card.active {
      transform: translateY(-2px);
      border-color: var(--primary);
    }

    .route-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .route-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary-dark);
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 500;
    }

    .badge-bus { background: #dcfce7; color: #15803d; }
    .badge-porpuesto { background: #fef3c7; color: #b45309; }
    .badge-colectivo { background: #e0f2fe; color: var(--primary-dark); }

    .route-details {
      font-size: 0.88rem;
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .route-details div {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .route-details i {
      color: var(--primary);
      width: 16px;
    }

    .stop-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .chip {
      background: #f1f5f9;
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      background: #0f172a;
      color: white;
      font-size: 0.85rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <header>
    <h1><i class="fa-solid fa-bus-simple"></i> Rutero Margarita</h1>
    <p>Rutas, paradas y líneas de transporte público en Nueva Esparta</p>
  </header>

  <div class="container">
    
    <!-- Barra de Conversión y Tasa -->
    <div class="fare-converter-bar">
      <div>
        <i class="fa-solid fa-calculator"></i> 
        <span>Tasa BCV Referencial (Bs/$):</span>
        <input type="number" id="exchangeRate" value="88.00" step="0.1" oninput="updateFares()">
      </div>
      <div style="font-size: 0.85rem; color: var(--text-muted);">
        <i class="fa-solid fa-circle-info"></i> Las tarifas se actualizan automáticamente al cambiar la tasa.
      </div>
    </div>

    <!-- Buscador y Filtros -->
    <div class="filter-section">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Buscar por origen, destino o parada (ej. Juangriego, Sambil)...">
      </div>
      <select id="municipalityFilter">
        <option value="">Todos los Municipios</option>
        <option value="Mariño">Mariño (Porlamar)</option>
        <option value="Maneiro">Maneiro (Pampatar)</option>
        <option value="Marcano">Marcano (Juangriego)</option>
        <option value="Antolín">Antolín del Campo</option>
        <option value="Tubores">Tubores (Punta de Piedras)</option>
        <option value="Díaz">Díaz (Aeropuerto / San Juan)</option>
        <option value="Macanao">Península de Macanao</option>
      </select>
      <select id="typeFilter">
        <option value="">Todos los Tipos</option>
        <option value="BusMargarita">Bus Margarita / TransMargarita</option>
        <option value="Colectivo">Autobús / Buseta Colectiva</option>
        <option value="PorPuesto">Carro Por Puesto</option>
      </select>
    </div>

    <!-- Layout Principal -->
    <div class="app-content">
      <!-- Lista de Rutas -->
      <div class="routes-list" id="routesList"></div>

      <!-- Mapa Interactivo -->
      <div id="map-container">
        <div id="map"></div>
      </div>
    </div>
  </div>

  <footer>
    <p>Rutero Margarita &copy; 2026 — Información comunitaria de transporte en Nueva Esparta.</p>
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const routesData = [
      {
        id: "porlamar-juangriego",
        name: "Porlamar ↔ Juangriego",
        line: "Línea Juangriego / TransMargarita",
        type: "Colectivo",
        municipality: "Marcano",
        fareUsd: 1.00,
        schedule: "05:30 AM - 07:30 PM",
        terminalOrigin: "Terminal de Porlamar (Conejeros / Centro)",
        terminalDest: "Terminal Ciudad de Juan Griego",
        stops: ["Porlamar Centro", "Conejeros", "La Asunción (Entrada)", "Tacarigua", "Santa Ana", "Juan Griego"],
        coords: [
          [10.9576, -63.8697], [10.9631, -63.8491], [11.0333, -63.8628], [11.0818, -63.9654]
        ]
      },
      {
        id: "porlamar-pampatar",
        name: "Porlamar ↔ Pampatar / C.C. AB",
        line: "Línea Maneiro",
        type: "Colectivo",
        municipality: "Maneiro",
        fareUsd: 0.75,
        schedule: "06:00 AM - 08:00 PM",
        terminalOrigin: "Av. 4 de Mayo / Mercado de Conejeros",
        terminalDest: "Pampatar Centro / C.C. AB",
        stops: ["Conejeros", "Av. Bolívar", "C.C. Sambil", "Costa Azul", "Agua de Vaca", "Pampatar Casco Histórico"],
        coords: [
          [10.9576, -63.8697], [10.9822, -63.8189], [10.9983, -63.7961]
        ]
      },
      {
        id: "porlamar-playa-el-agua",
        name: "Porlamar ↔ Playa El Agua / Manzanillo",
        line: "Línea Antolín del Campo",
        type: "Colectivo",
        municipality: "Antolín",
        fareUsd: 1.25,
        schedule: "06:00 AM - 06:30 PM",
        terminalOrigin: "Terminal de Pasajeros Porlamar",
        terminalDest: "Playa El Agua / El Tirano / Manzanillo",
        stops: ["Porlamar", "La Asunción", "El Cardón", "La Plaza", "El Tirano", "Playa El Agua", "Manzanillo"],
        coords: [
          [10.9576, -63.8697], [11.0333, -63.8628], [11.1438, -63.8625], [11.1712, -63.8741]
        ]
      },
      {
        id: "porlamar-punta-de-piedras",
        name: "Porlamar ↔ Punta de Piedras (Ferry)",
        line: "Bus Margarita / TransTubores",
        type: "BusMargarita",
        municipality: "Tubores",
        fareUsd: 1.00,
        schedule: "05:00 AM - 08:00 PM",
        terminalOrigin: "Terminal de Porlamar",
        terminalDest: "Terminal de Ferries Punta de Piedras",
        stops: ["Porlamar", "Villa Rosa", "Las Cuotas", "El Espinal", "Punta de Piedras"],
        coords: [
          [10.9576, -63.8697], [10.9123, -63.9142], [10.9085, -64.1011]
        ]
      },
      {
        id: "porlamar-el-yaque",
        name: "Porlamar ↔ El Yaque / Aeropuerto",
        line: "Línea Díaz - El Yaque",
        type: "PorPuesto",
        municipality: "Díaz",
        fareUsd: 1.50,
        schedule: "06:00 AM - 07:00 PM",
        terminalOrigin: "Calle Igualdad (Porlamar)",
        terminalDest: "Playa El Yaque / Aeropuerto Santiago Mariño",
        stops: ["Porlamar Centro", "Av. 4 de Mayo", "La Encrucijada", "Aeropuerto (PMV)", "El Yaque"],
        coords: [
          [10.9576, -63.8697], [10.9123, -63.9500], [10.9022, -63.9631]
        ]
      },
      {
        id: "porlamar-macanao",
        name: "Porlamar ↔ Boca de Río / Punta Arenas",
        line: "Línea Península de Macanao",
        type: "Colectivo",
        municipality: "Macanao",
        fareUsd: 2.00,
        schedule: "05:30 AM - 05:00 PM",
        terminalOrigin: "Terminal de Porlamar",
        terminalDest: "Boca de Río / San Francisco / Punta Arenas",
        stops: ["Porlamar", "Punta de Piedras", "Puente de la Restinga", "Boca de Río", "Boca de Pozo", "Punta Arenas"],
        coords: [
          [10.9576, -63.8697], [10.9085, -64.1011], [10.9633, -64.1782], [10.9751, -64.3982]
        ]
      }
    ];

    const map = L.map('map').setView([10.9971, -63.9113], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let activePolyline = null;
    let markers = [];

    function renderRoutes(routes) {
      const listContainer = document.getElementById('routesList');
      listContainer.innerHTML = '';
      const rate = parseFloat(document.getElementById('exchangeRate').value) || 1;

      if (routes.length === 0) {
        listContainer.innerHTML = `<div style="text-align:center; padding: 2rem; color: var(--text-muted);">No se encontraron rutas para el filtro seleccionado.</div>`;
        return;
      }

      routes.forEach(route => {
        const card = document.createElement('div');
        card.className = 'route-card';
        card.onclick = (e) => selectRoute(route, e.currentTarget);

        let badgeClass = 'badge-colectivo';
        if (route.type === 'BusMargarita') badgeClass = 'badge-bus';
        if (route.type === 'PorPuesto') badgeClass = 'badge-porpuesto';

        const fareBs = (route.fareUsd * rate).toFixed(2);

        card.innerHTML = `
          <div class="route-header">
            <div>
              <div class="route-title">${route.name}</div>
              <small style="color: var(--text-muted);">${route.line}</small>
            </div>
            <span class="badge ${badgeClass}">${route.type}</span>
          </div>
          <div class="route-details">
            <div><i class="fa-solid fa-location-dot"></i> <strong>Origen:</strong> ${route.terminalOrigin}</div>
            <div><i class="fa-solid fa-flag-checkered"></i> <strong>Destino:</strong> ${route.terminalDest}</div>
            <div><i class="fa-solid fa-clock"></i> <strong>Horario:</strong> ${route.schedule}</div>
            <div><i class="fa-solid fa-money-bill-wave"></i> <strong>Tarifa:</strong> $${route.fareUsd.toFixed(2)} (Bs. ${fareBs})</div>
          </div>
          <div class="stop-chips">
            ${route.stops.map(stop => `<span class="chip">${stop}</span>`).join('')}
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    function selectRoute(route, cardElement) {
      if (activePolyline) map.removeLayer(activePolyline);
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      activePolyline = L.polyline(route.coords, {
        color: '#0284c7',
        weight: 5,
        opacity: 0.8
      }).addTo(map);

      const startMarker = L.marker(route.coords[0]).addTo(map).bindPopup(`<b>Origen:</b> ${route.terminalOrigin}`);
      const endMarker = L.marker(route.coords[route.coords.length - 1]).addTo(map).bindPopup(`<b>Destino:</b> ${route.terminalDest}`);

      markers.push(startMarker, endMarker);
      map.fitBounds(activePolyline.getBounds(), { padding: [30, 30] });

      document.querySelectorAll('.route-card').forEach(c => c.classList.remove('active'));
      if (cardElement) cardElement.classList.add('active');
    }

    function filterRoutes() {
      const searchText = document.getElementById('searchInput').value.toLowerCase();
      const selectedMun = document.getElementById('municipalityFilter').value;
      const selectedType = document.getElementById('typeFilter').value;

      const filtered = routesData.filter(route => {
        const matchesSearch = route.name.toLowerCase().includes(searchText) ||
                              route.stops.some(s => s.toLowerCase().includes(searchText)) ||
                              route.terminalOrigin.toLowerCase().includes(searchText) ||
                              route.terminalDest.toLowerCase().includes(searchText);

        const matchesMun = selectedMun === "" || route.municipality === selectedMun;
        const matchesType = selectedType === "" || route.type === selectedType;

        return matchesSearch && matchesMun && matchesType;
      });

      renderRoutes(filtered);
    }

    function updateFares() {
      filterRoutes();
    }

    document.getElementById('searchInput').addEventListener('input', filterRoutes);
    document.getElementById('municipalityFilter').addEventListener('change', filterRoutes);
    document.getElementById('typeFilter').addEventListener('change', filterRoutes);

    renderRoutes(routesData);
  </script>
</body>
</html>
