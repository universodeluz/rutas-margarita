<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rutero Margarita | Red de Transporte Público de Nueva Esparta</title>
  
  <!-- Manifest PWA Integrado -->
  <meta name="theme-color" content="#032b43">
  <link rel="manifest" href="data:application/manifest+json,{
    'name': 'Rutero Margarita',
    'short_name': 'RuteroMGA',
    'start_url': './index.html',
    'display': 'standalone',
    'background_color': '#f4f6f8',
    'theme_color': '#032b43',
    'icons': [{
      'src': 'https://img.icons8.com/color/192/000000/bus.png',
      'sizes': '192x192',
      'type': 'image/png'
    }]
  }">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --tmb-dark: #032b43;
      --tmb-red: #d90429;
      --tmb-blue: #0284c7;
      --tmb-green: #10b981;
      --tmb-yellow: #f59e0b;
      --bg-gray: #f4f6f8;
      --card-white: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-gray);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background-color: var(--tmb-dark);
      color: white;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: var(--shadow-md);
    }

    .top-bar {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0.75rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: white;
    }

    .brand-logo {
      background: var(--tmb-red);
      color: white;
      font-weight: 800;
      font-size: 1.2rem;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      letter-spacing: -0.5px;
    }

    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .brand-text span {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .status-badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--tmb-green);
      color: #34d399;
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--tmb-green);
      border-radius: 50%;
    }

    /* MAIN LAYOUT */
    .app-container {
      max-width: 1280px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      width: 100%;
      flex: 1;
    }

    /* PLANIFICADOR */
    .planner-card {
      background: var(--card-white);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      box-shadow: var(--shadow-md);
      margin-bottom: 1.5rem;
      border: 1px solid var(--border-color);
    }

    .planner-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 12px;
      align-items: center;
    }

    @media (max-width: 992px) {
      .planner-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 640px) {
      .planner-grid {
        grid-template-columns: 1fr;
      }
    }

    .input-group {
      position: relative;
    }

    .input-group i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .input-group input, .input-group select {
      width: 100%;
      padding: 10px 12px 10px 38px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      outline: none;
      background: #fafafa;
      transition: border 0.2s;
    }

    .input-group input:focus, .input-group select:focus {
      border-color: var(--tmb-blue);
      background: white;
    }

    .btn-tmb-primary {
      background: var(--tmb-red);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      padding: 10px 20px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* GRID DE CONTENIDO */
    .content-grid {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 1024px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    /* PANEL DE RUTAS */
    .routes-panel {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-height: calc(100vh - 220px);
      overflow-y: auto;
      padding-right: 4px;
    }

    .route-card {
      background: var(--card-white);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
      cursor: pointer;
      overflow: hidden;
    }

    .route-card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--tmb-blue);
    }

    .route-card.selected {
      border: 2px solid var(--tmb-blue);
      background: #f0f9ff;
    }

    .route-card-header {
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f1f5f9;
    }

    .line-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 6px;
      color: white;
    }

    .bg-bus { background-color: var(--tmb-red); }
    .bg-trans { background-color: var(--tmb-blue); }
    .bg-puesto { background-color: var(--tmb-yellow); color: #78350f; }

    .route-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .line-operator-tag {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--tmb-blue);
      margin-top: 2px;
    }

    .route-card-body {
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.85rem;
    }

    .route-info-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
    }

    .route-info-row i {
      width: 16px;
      color: var(--tmb-blue);
    }

    /* DETALLE AMPLIADO DE LÍNEA */
    .line-detail-box {
      background: white;
      border-radius: var(--radius-md);
      padding: 1.25rem;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-md);
      margin-bottom: 1rem;
    }

    .direction-switcher {
      display: flex;
      background: #f1f5f9;
      border-radius: var(--radius-md);
      padding: 4px;
      margin: 1rem 0;
      gap: 4px;
    }

    .dir-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: none;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .dir-btn.active {
      background: white;
      color: var(--tmb-dark);
      box-shadow: var(--shadow-sm);
    }

    .stops-timeline {
      position: relative;
      padding-left: 20px;
      margin-top: 1rem;
    }

    .stops-timeline::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 8px;
      bottom: 8px;
      width: 3px;
      background-color: var(--tmb-blue);
      border-radius: 2px;
    }

    .stop-item {
      position: relative;
      padding: 8px 0 8px 16px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stop-item::before {
      content: '';
      position: absolute;
      left: -18px;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: white;
      border: 3px solid var(--tmb-blue);
    }

    /* MAPA */
    .map-wrapper {
      position: sticky;
      top: 80px;
      height: calc(100vh - 200px);
      min-height: 480px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* BARRA DE TASA */
    .fare-floating-bar {
      background: var(--tmb-dark);
      color: white;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .rate-input {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      width: 80px;
      font-size: 0.85rem;
      text-align: center;
      outline: none;
    }

    footer {
      background: var(--tmb-dark);
      color: #94a3b8;
      text-align: center;
      padding: 1.5rem;
      font-size: 0.85rem;
      margin-top: 3rem;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="top-bar">
      <a href="#" class="brand">
        <span class="brand-logo">RM</span>
        <div class="brand-text">
          <h1>Rutero Margarita</h1>
          <span>Red de Transporte Nueva Esparta</span>
        </div>
      </a>

      <div class="status-badge">
        <div class="status-dot"></div>
        <span>Servicio Operativo</span>
      </div>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="app-container">

    <!-- BUSCADOR -->
    <div class="planner-card">
      <div class="planner-grid">
        <div class="input-group">
          <i class="fa-solid fa-location-dot"></i>
          <input type="text" id="originInput" placeholder="Origen (ej: Porlamar, La Vela)">
        </div>
        <div class="input-group">
          <i class="fa-solid fa-flag-checkered"></i>
          <input type="text" id="destInput" placeholder="Destino (ej: Pampatar, El Agua)">
        </div>
        <div class="input-group">
          <i class="fa-solid fa-filter"></i>
          <select id="municipalitySelect" onchange="applyFilters()">
            <option value="">Todos los Municipios</option>
            <option value="Mariño">Mariño (Porlamar)</option>
            <option value="Maneiro">Maneiro (Pampatar / La Vela)</option>
            <option value="Marcano">Marcano (Juangriego)</option>
            <option value="Antolín">Antolín del Campo</option>
            <option value="Tubores">Tubores (Punta de Piedras)</option>
            <option value="Díaz">Díaz (San Juan / Aeropuerto)</option>
            <option value="Macanao">Península de Macanao</option>
          </select>
        </div>
        <button class="btn-tmb-primary" onclick="applyFilters()">
          <i class="fa-solid fa-magnifying-glass"></i> Buscar
        </button>
      </div>
    </div>

    <!-- GRID RESULTADOS Y MAPA -->
    <div class="content-grid">

      <!-- PANEL IZQUIERDO -->
      <div class="left-section">

        <!-- VISTA DETALLE -->
        <div id="selectedLineDetail" style="display: none;" class="line-detail-box">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span id="detailBadge" class="line-badge bg-bus">L-01</span>
            <button onclick="closeLineDetail()" style="background: none; border: none; cursor: pointer; color: var(--text-muted);"><i class="fa-solid fa-xmark fa-lg"></i> Cerrar detalle</button>
          </div>
          
          <h2 id="detailTitle" style="font-size: 1.1rem; margin-top: 8px;">Porlamar ↔ Juangriego</h2>
          <div id="detailLineName" style="font-weight: 600; color: var(--tmb-blue); font-size: 0.85rem;">Línea Juangriego / Turis-Mar</div>
          
          <!-- SELECTOR DE SENTIDO -->
          <div class="direction-switcher">
            <button id="btnDirIda" class="dir-btn active" onclick="setDirection('ida')">
              <i class="fa-solid fa-arrow-right"></i> Sentido Ida
            </button>
            <button id="btnDirVuelta" class="dir-btn" onclick="setDirection('vuelta')">
              <i class="fa-solid fa-arrow-left"></i> Sentido Vuelta
            </button>
          </div>

          <div id="stopsTimeline" class="stops-timeline"></div>
        </div>

        <!-- LISTA DE RUTAS -->
        <div class="routes-panel" id="routesList"></div>

      </div>

      <!-- MAPA INTERACTIVO -->
      <div class="map-wrapper">
        <div id="map"></div>

        <!-- BARRA DE TASA BCV -->
        <div class="fare-floating-bar">
          <div>
            <i class="fa-solid fa-calculator"></i> Tasa BCV Oficial: 
            <input type="number" id="exchangeRate" class="rate-input" value="88.50" step="0.1" oninput="renderRoutesList()">
          </div>
          <div id="fareStatusMsg" style="font-size: 0.75rem; color: #38bdf8;">
            Cargando tasa del día...
          </div>
        </div>
      </div>

    </div>
  </div>

  <footer>
    <p><strong>Rutero Margarita</strong> &copy; 2026 — Proyecto independiente de información para la Isla de Margarita.</p>
  </footer>

          [10.9022, -63.9631], [10.9123, -63.9500], [10.9576, -63.8697]
        ],
        stopsIda: [
          { name: "Calle Igualdad (Porlamar)", wait: "Origen" },
          { name: "Av. 4 de Mayo", wait: "~5 min" },
          { name: "Aeropuerto Santiago Mariño", wait: "~20 min" },
          { name: "Playa El Yaque", wait: "Destino" }
        ],
        stopsVuelta: [
          { name: "Playa El Yaque", wait: "Origen" },
          { name: "Aeropuerto Santiago Mariño", wait: "~5 min" },
          { name: "Av. 4 de Mayo", wait: "~20 min" },
          { name: "Calle Igualdad (Porlamar)", wait: "Destino" }
        ]
      },
      {
        id: "porlamar-macanao",
        code: "L-06",
        line: "Línea Península de Macanao",
        name: "Porlamar ↔ Boca de Río / Punta Arenas",
        type: "Colectivo",
        badgeClass: "bg-bus",
        municipality: "Macanao",
        fareUsd: 2.00,
        schedule: "05:30 AM - 05:00 PM",
        coordsIda: [
          [10.9576, -63.8697], [10.9085, -64.1011], [10.9633, -64.1782], [10.9751, -64.3982]
        ],
        coordsVuelta: [
          [10.9751, -64.3982], [10.9633, -64.1782], [10.9085, -64.1011], [10.9576, -63.8697]
        ],
        stopsIda: [
          { name: "Terminal de Porlamar", wait: "Origen" },
          { name: "Punta de Piedras", wait: "~30 min" },
          { name: "Puente de la Restinga", wait: "~40 min" },
          { name: "Boca de Río", wait: "~50 min" },
          { name: "Punta Arenas", wait: "Destino" }
        ],
        stopsVuelta: [
          { name: "Punta Arenas", wait: "Origen" },
          { name: "Boca de Río", wait: "~15 min" },
          { name: "Puente de la Restinga", wait: "~25 min" },
          { name: "Punta de Piedras", wait: "~35 min" },
          { name: "Terminal de Porlamar", wait: "Destino" }
        ]
      }
    ];

    let currentSelectedRoute = null;
    let currentDirection = 'ida';
    let mapPolyline = null;
    let mapMarkers = [];

    // INICIALIZAR MAPA
    const map = L.map('map').setView([10.9971, -63.9113], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // FUNCIÓN PARA CONSULTAR TASA BCV AUTOMÁTICAMENTE
    async function fetchBcvRate() {
      const statusMsg = document.getElementById('fareStatusMsg');
      try {
        const response = await fetch('https://pydolarvenezuela-api.vercel.app/api/v1/dollar/bcv');
        const data = await response.json();
        
        if (data && data.monitors && data.monitors.bcv) {
          const bcvPrice = data.monitors.bcv.price;
          document.getElementById('exchangeRate').value = bcvPrice;
          statusMsg.innerText = "Tasa BCV sincronizada en línea";
          renderRoutesList();
        }
      } catch (error) {
        statusMsg.innerText = "Modo manual activo (Tasa local)";
        console.log("No se pudo conectar a la API del BCV, usando valor por defecto.", error);
      }
    }

    function renderRoutesList() {
      const container = document.getElementById('routesList');
      container.innerHTML = '';

      const rate = parseFloat(document.getElementById('exchangeRate').value) || 1;
      const originSearch = document.getElementById('originInput').value.toLowerCase();
      const destSearch = document.getElementById('destInput').value.toLowerCase();
      const selectedMun = document.getElementById('municipalitySelect').value;

      const filtered = routesData.filter(r => {
        const matchesOrigin = !originSearch || r.name.toLowerCase().includes(originSearch) || r.stopsIda.some(s => s.name.toLowerCase().includes(originSearch));
        const matchesDest = !destSearch || r.name.toLowerCase().includes(destSearch) || r.stopsIda.some(s => s.name.toLowerCase().includes(destSearch));
        const matchesMun = !selectedMun || r.municipality === selectedMun;

        return matchesOrigin && matchesDest && matchesMun;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 2rem; color: var(--text-muted);">No se encontraron rutas con los filtros seleccionados.</div>`;
        return;
      }

      filtered.forEach(route => {
        const fareBs = (route.fareUsd * rate).toFixed(2);
        const card = document.createElement('div');
        card.className = `route-card ${currentSelectedRoute && currentSelectedRoute.id === route.id ? 'selected' : ''}`;
        card.onclick = () => selectRoute(route);

        card.innerHTML = `
          <div class="route-card-header">
            <span class="line-badge ${route.badgeClass}">${route.code}</span>
            <span style="font-size: 0.75rem; color: var(--text-muted);"><i class="fa-solid fa-clock"></i> ${route.schedule}</span>
          </div>
          <div class="route-card-body">
            <div class="route-title">${route.name}</div>
            <div class="line-operator-tag"><i class="fa-solid fa-bus"></i> ${route.line}</div>
            <div class="route-info-row"><i class="fa-solid fa-money-bill-wave"></i> Tarifa: $${route.fareUsd.toFixed(2)} (~Bs. ${fareBs})</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function selectRoute(route) {
      currentSelectedRoute = route;
      currentDirection = 'ida';

      document.getElementById('selectedLineDetail').style.display = 'block';
      document.getElementById('detailBadge').className = `line-badge ${route.badgeClass}`;
      document.getElementById('detailBadge').innerText = route.code;
      document.getElementById('detailTitle').innerText = route.name;
      document.getElementById('detailLineName').innerText = route.line;

      updateTimelineAndMap();
      renderRoutesList();
    }

    function closeLineDetail() {
      document.getElementById('selectedLineDetail').style.display = 'none';
      currentSelectedRoute = null;
      if (mapPolyline) map.removeLayer(mapPolyline);
      mapMarkers.forEach(m => map.removeLayer(m));
      renderRoutesList();
    }

    function setDirection(dir) {
      currentDirection = dir;
      document.getElementById('btnDirIda').className = `dir-btn ${dir === 'ida' ? 'active' : ''}`;
      document.getElementById('btnDirVuelta').className = `dir-btn ${dir === 'vuelta' ? 'active' : ''}`;
      updateTimelineAndMap();
    }

    function updateTimelineAndMap() {
      if (!currentSelectedRoute) return;

      const stops = currentDirection === 'ida' ? currentSelectedRoute.stopsIda : currentSelectedRoute.stopsVuelta;
      const coords = currentDirection === 'ida' ? currentSelectedRoute.coordsIda : currentSelectedRoute.coordsVuelta;

      const timeline = document.getElementById('stopsTimeline');
      timeline.innerHTML = '';
      stops.forEach(s => {
        const item = document.createElement('div');
        item.className = 'stop-item';
        item.innerHTML = `<span>${s.name}</span> <span style="font-size:0.75rem; color:var(--text-muted);">${s.wait}</span>`;
        timeline.appendChild(item);
      });

      if (mapPolyline) map.removeLayer(mapPolyline);
      mapMarkers.forEach(m => map.removeLayer(m));
      mapMarkers = [];

      mapPolyline = L.polyline(coords, {
        color: '#0284c7',
        weight: 6,
        opacity: 0.85
      }).addTo(map);

      const startMarker = L.marker(coords[0]).addTo(map).bindPopup(`<b>Origen:</b> ${stops[0].name}`);
      const endMarker = L.marker(coords[coords.length - 1]).addTo(map).bindPopup(`<b>Destino:</b> ${stops[stops.length - 1].name}`);
      mapMarkers.push(startMarker, endMarker);

      map.fitBounds(mapPolyline.getBounds(), { padding: [30, 30] });
    }

    function applyFilters() {
      renderRoutesList();
    }

    // CARGA INICIAL
    window.addEventListener('DOMContentLoaded', () => {
      renderRoutesList();
      fetchBcvRate(); // Consulta automática al abrir la aplicación
    });
  </script>
</body>
</html>
