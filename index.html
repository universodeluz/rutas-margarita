<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rutero Margarita — Red de Transporte Público de Nueva Esparta</title>
  
  <!-- Configuración PWA -->
  <meta name="theme-color" content="#d97706">
  <link rel="manifest" href="data:application/manifest+json,{
    'name': 'Rutero Margarita',
    'short_name': 'RuteroMGA',
    'start_url': './index.html',
    'display': 'standalone',
    'background_color': '#f8fafc',
    'theme_color': '#0284c7',
    'icons': [{
      'src': 'https://img.icons8.com/color/192/000000/bus.png',
      'sizes': '192x192',
      'type': 'image/png'
    }]
  }">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --tmb-red: #e11d48;
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --secondary: #0f172a;
      --bg-light: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.08);
      --success: #16a34a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-light);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Top Navigation Style TMB */
    header {
      background: var(--secondary);
      color: white;
      padding: 1rem 1.5rem;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      background: var(--tmb-red);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    .brand-title h1 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .brand-title p {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .rate-pill {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rate-pill input {
      background: transparent;
      border: none;
      color: #38bdf8;
      font-weight: 700;
      width: 70px;
      outline: none;
      font-size: 0.9rem;
    }

    /* Planificador estilo TMB */
    .planner-wrapper {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 1.2rem 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
    }

    .planner-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr 180px auto;
      gap: 12px;
      align-items: center;
    }

    @media (max-width: 900px) {
      .planner-grid {
        grid-template-columns: 1fr;
      }
    }

    .input-group {
      position: relative;
    }

    .input-group i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .input-group input, .input-group select {
      width: 100%;
      padding: 12px 12px 12px 42px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
    }

    .input-group input:focus, .input-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    /* Main Container */
    .container {
      max-width: 1200px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      width: 100%;
      flex: 1;
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    /* Lista de Rutas */
    .routes-column {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-height: calc(100vh - 220px);
      overflow-y: auto;
      padding-right: 4px;
    }

    .route-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.2rem;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
      cursor: pointer;
      position: relative;
    }

    .route-card:hover, .route-card.active {
      border-color: var(--primary);
      box-shadow: 0 6px 16px -2px rgba(2, 132, 199, 0.15);
    }

    .route-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .line-number {
      background: var(--primary);
      color: white;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .fav-btn {
      background: transparent;
      border: none;
      color: #cbd5e1;
      font-size: 1.1rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .fav-btn.active {
      color: #f59e0b;
    }

    .route-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--secondary);
      margin-bottom: 4px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--success);
      font-weight: 600;
      margin-bottom: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
    }

    .direction-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f1f5f9;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 0.82rem;
    }

    .toggle-btn {
      background: white;
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 600;
      color: var(--primary-dark);
    }

    .route-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      border-top: 1px dashed var(--border);
      padding-top: 10px;
    }

    .route-meta div {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Mapa */
    .map-column {
      position: sticky;
      top: 1.5rem;
      height: calc(100vh - 220px);
      min-height: 450px;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    #map {
      width: 100%;
      height: 100%;
    }

    footer {
      text-align: center;
      padding: 1.2rem;
      background: var(--secondary);
      color: #94a3b8;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <!-- Topbar Style TMB -->
  <header>
    <div class="brand">
      <div class="brand-logo">TMB-MGA</div>
      <div class="brand-title">
        <h1>Rutero Margarita</h1>
        <p>Red Oficial de Transporte Público de Nueva Esparta</p>
      </div>
    </div>
    <div class="rate-pill">
      <i class="fa-solid fa-coins" style="color: #f59e0b;"></i>
      <span>BCV (Bs/$):</span>
      <input type="number" id="exchangeRate" value="88.00" step="0.5" oninput="renderRoutes()">
    </div>
  </header>

  <!-- Planificador "Cómo ir" -->
  <div class="planner-wrapper">
    <div class="planner-grid">
      <div class="input-group">
        <i class="fa-solid fa-location-dot"></i>
        <input type="text" id="originInput" placeholder="¿Desde dónde viajas? (ej. Porlamar, Sambil)">
      </div>
      <div class="input-group">
        <i class="fa-solid fa-flag-checkered"></i>
        <input type="text" id="destInput" placeholder="¿A dónde vas? (ej. Juangriego, Playa El Agua)">
      </div>
      <div class="input-group">
        <i class="fa-solid fa-map-location-dot"></i>
        <select id="municipalityFilter">
          <option value="">Todos los Municipios</option>
          <option value="Mariño">Mariño</option>
          <option value="Maneiro">Maneiro</option>
          <option value="Marcano">Marcano</option>
          <option value="Antolín">Antolín del Campo</option>
          <option value="Tubores">Tubores</option>
          <option value="Díaz">Díaz</option>
          <option value="Macanao">Península de Macanao</option>
        </select>
      </div>
      <button onclick="clearPlanner()" style="background: #f1f5f9; border: 1px solid var(--border); padding: 12px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600;">
        <i class="fa-solid fa-rotate-left"></i> Limpiar
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    <div class="routes-column" id="routesList"></div>
    <div class="map-column">
      <div id="map"></div>
    </div>
  </div>

  <footer>
    <p>Rutero Margarita &copy; 2026 — Basado en el estándar de servicios TMB Barcelona para Nueva Esparta.</p>
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const routesData = [
      {
        id: "L-01",
        name: "Porlamar ↔ Juangriego",
        line: "Línea Juangriego / TransMargarita",
        type: "Colectivo",
        municipality: "Marcano",
        fareUsd: 1.00,
        freq: "Cada 15 min",
        status: "Línea sin incidencias",
        schedule: "05:30 - 19:30",
        terminalOrigin: "Terminal de Porlamar",
        terminalDest: "Terminal de Juan Griego",
        stops: ["Porlamar Centro", "Conejeros", "La Asunción", "Tacarigua", "Santa Ana", "Juan Griego"],
        coords: [
          [10.9576, -63.8697], [10.9631, -63.8491], [11.0333, -63.8628], [11.0818, -63.9654]
        ]
      },
      {
        id: "L-02",
        name: "Porlamar ↔ Pampatar / C.C. AB",
        line: "Línea Maneiro",
        type: "Colectivo",
        municipality: "Maneiro",
        fareUsd: 0.75,
        freq: "Cada 10 min",
        status: "Línea sin incidencias",
        schedule: "06:00 - 20:00",
        terminalOrigin: "Mercado de Conejeros",
        terminalDest: "Pampatar Casco Histórico",
        stops: ["Conejeros", "Av. Bolívar", "C.C. Sambil", "Costa Azul", "Pampatar"],
        coords: [
          [10.9576, -63.8697], [10.9822, -63.8189], [10.9983, -63.7961]
        ]
      },
      {
        id: "L-03",
        name: "Porlamar ↔ Playa El Agua / Manzanillo",
        line: "Línea Antolín del Campo",
        type: "Colectivo",
        municipality: "Antolín",
        fareUsd: 1.25,
        freq: "Cada 20 min",
        status: "Línea sin incidencias",
        schedule: "06:00 - 18:30",
        terminalOrigin: "Terminal de Porlamar",
        terminalDest: "Manzanillo",
        stops: ["Porlamar", "La Asunción", "El Cardón", "Playa El Agua", "Manzanillo"],
        coords: [
          [10.9576, -63.8697], [11.0333, -63.8628], [11.1438, -63.8625], [11.1712, -63.8741]
        ]
      },
      {
        id: "L-04",
        name: "Porlamar ↔ Punta de Piedras",
        line: "Bus Margarita / TransTubores",
        type: "BusMargarita",
        municipality: "Tubores",
        fareUsd: 1.00,
        freq: "Cada 30 min",
        status: "Línea sin incidencias",
        schedule: "05:00 - 20:00",
        terminalOrigin: "Terminal de Porlamar",
        terminalDest: "Terminal de Ferries",
        stops: ["Porlamar", "Villa Rosa", "Las Cuotas", "El Espinal", "Punta de Piedras"],
        coords: [
          [10.9576, -63.8697], [10.9123, -63.9142], [10.9085, -64.1011]
        ]
      },
      {
        id: "L-05",
        name: "Porlamar ↔ El Yaque / Aeropuerto",
        line: "Línea Díaz",
        type: "PorPuesto",
        municipality: "Díaz",
        fareUsd: 1.50,
        freq: "Cada 15 min",
        status: "Línea sin incidencias",
        schedule: "06:00 - 19:00",
        terminalOrigin: "Calle Igualdad",
        terminalDest: "Playa El Yaque",
        stops: ["Porlamar", "Av. 4 de Mayo", "Aeropuerto", "El Yaque"],
        coords: [
          [10.9576, -63.8697], [10.9123, -63.9500], [10.9022, -63.9631]
        ]
      }
    ];

    let favs = JSON.parse(localStorage.getItem('mga_favs') || '[]');
    let currentDirections = {};

    // Inicializar mapa
    const map = L.map('map').setView([10.9971, -63.9113], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let activePolyline = null;
    let markers = [];

    function toggleFav(id, e) {
      e.stopPropagation();
      if (favs.includes(id)) {
        favs = favs.filter(f => f !== id);
      } else {
        favs.push(id);
      }
      localStorage.setItem('mga_favs', JSON.stringify(favs));
      renderRoutes();
    }

    function toggleDirection(id, e) {
      e.stopPropagation();
      currentDirections[id] = currentDirections[id] === 'REV' ? 'FWD' : 'REV';
      renderRoutes();
    }

    function renderRoutes() {
      const listContainer = document.getElementById('routesList');
      listContainer.innerHTML = '';
      const rate = parseFloat(document.getElementById('exchangeRate').value) || 1;
      const originSearch = document.getElementById('originInput').value.toLowerCase();
      const destSearch = document.getElementById('destInput').value.toLowerCase();
      const selectedMun = document.getElementById('municipalityFilter').value;

      const filtered = routesData.filter(r => {
        const matchesOrigin = !originSearch || r.stops.some(s => s.toLowerCase().includes(originSearch)) || r.terminalOrigin.toLowerCase().includes(originSearch);
        const matchesDest = !destSearch || r.stops.some(s => s.toLowerCase().includes(destSearch)) || r.terminalDest.toLowerCase().includes(destSearch);
        const matchesMun = !selectedMun || r.municipality === selectedMun;

        return matchesOrigin && matchesDest && matchesMun;
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = `<div style="text-align:center; padding: 2rem; color: var(--text-muted);">No hay rutas disponibles para la búsqueda realizada.</div>`;
        return;
      }

      filtered.forEach(route => {
        const isFav = favs.includes(route.id);
        const isRev = currentDirections[route.id] === 'REV';
        
        const origText = isRev ? route.terminalDest : route.terminalOrigin;
        const destText = isRev ? route.terminalOrigin : route.terminalDest;
        const fareBs = (route.fareUsd * rate).toFixed(2);

        const card = document.createElement('div');
        card.className = 'route-card';
        card.onclick = (e) => selectRoute(route, isRev, e.currentTarget);

        card.innerHTML = `
          <div class="route-header">
            <span class="line-number">${route.id}</span>
            <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav('${route.id}', event)">
              <i class="fa-${isFav ? 'solid' : 'regular'} fa-star"></i>
            </button>
          </div>
          <div class="route-title">${route.name}</div>
          <div class="status-badge">
            <span class="status-dot"></span>
            ${route.status}
          </div>
          <div class="direction-toggle">
            <span><strong>Sentido:</strong> ${origText} ➔ ${destText}</span>
            <button class="toggle-btn" onclick="toggleDirection('${route.id}', event)">
              <i class="fa-solid fa-arrows-rotate"></i> Cambiar
            </button>
          </div>
          <div class="route-meta">
            <div><i class="fa-solid fa-clock"></i> ${route.schedule}</div>
            <div><i class="fa-solid fa-rotate"></i> ${route.freq}</div>
            <div><i class="fa-solid fa-money-bill-wave"></i> $${route.fareUsd.toFixed(2)}</div>
            <div><i class="fa-solid fa-building-columns"></i> Bs. ${fareBs}</div>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    function selectRoute(route, isRev, cardElement) {
      if (activePolyline) map.removeLayer(activePolyline);
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const coords = isRev ? [...route.coords].reverse() : route.coords;
      const startText = isRev ? route.terminalDest : route.terminalOrigin;
      const endText = isRev ? route.terminalOrigin : route.terminalDest;

      activePolyline = L.polyline(coords, {
        color: '#0284c7',
        weight: 6,
        opacity: 0.85
      }).addTo(map);

      const startMarker = L.marker(coords[0]).addTo(map).bindPopup(`<b>Origen:</b> ${startText}`);
      const endMarker = L.marker(coords[coords.length - 1]).addTo(map).bindPopup(`<b>Destino:</b> ${endText}`);

      markers.push(startMarker, endMarker);
      map.fitBounds(activePolyline.getBounds(), { padding: [35, 35] });

      document.querySelectorAll('.route-card').forEach(c => c.classList.remove('active'));
      if (cardElement) cardElement.classList.add('active');
    }

    function clearPlanner() {
      document.getElementById('originInput').value = '';
      document.getElementById('destInput').value = '';
      document.getElementById('municipalityFilter').value = '';
      renderRoutes();
    }

    document.getElementById('originInput').addEventListener('input', renderRoutes);
    document.getElementById('destInput').addEventListener('input', renderRoutes);
    document.getElementById('municipalityFilter').addEventListener('change', renderRoutes);

    renderRoutes();
  </script>
</body>
</html>
